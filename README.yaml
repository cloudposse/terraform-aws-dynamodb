# Short description of this project
description: |-
  Terraform module to provision a DynamoDB table with autoscaling.

  Autoscaler scales up/down the provisioned OPS for the DynamoDB table based on the load.

  ## Requirements

  This module requires [AWS Provider](https://github.com/terraform-providers/terraform-provider-aws) `>= 6.28.0`

  **IMPORTANT:** Due to the inclusion of experimental AWS provider features, all users must set the following environment variable before running Terraform:
  ```bash
  export TF_AWS_EXPERIMENT_dynamodb_global_secondary_index=1
  ```
  
  This is required even if you're not using the experimental `global_secondary_index_resource_enabled` feature.
# How to use this project
usage: |2-

  For a complete example, see [examples/complete](examples/complete).

  For automated tests of the complete example using [bats](https://github.com/bats-core/bats-core) and [Terratest](https://github.com/gruntwork-io/terratest) (which tests and deploys the example on AWS), see [test](test).

  ```hcl
  module "dynamodb_table" {
    source = "cloudposse/dynamodb/aws"
    # Cloud Posse recommends pinning every module to a specific version
    # version     = "x.x.x"
    namespace                    = "eg"
    stage                        = "dev"
    name                         = "cluster"
    hash_key                     = "HashKey"
    range_key                    = "RangeKey"
    autoscale_write_target       = 50
    autoscale_read_target        = 50
    autoscale_min_read_capacity  = 5
    autoscale_max_read_capacity  = 20
    autoscale_min_write_capacity = 5
    autoscale_max_write_capacity = 20
    enable_autoscaler            = true
  }
  ```

  ## Advanced Usage

  With additional attributes, global secondary indexes and `non_key_attributes` (see [examples/complete](examples/complete)).

  ```hcl
  module "dynamodb_table" {
    source = "cloudposse/dynamodb/aws"
    # Cloud Posse recommends pinning every module to a specific version
    # version     = "x.x.x"
    namespace                    = "eg"
    stage                        = "dev"
    name                         = "cluster"
    hash_key                     = "HashKey"
    range_key                    = "RangeKey"
    autoscale_write_target       = 50
    autoscale_read_target        = 50
    autoscale_min_read_capacity  = 5
    autoscale_max_read_capacity  = 20
    autoscale_min_write_capacity = 5
    autoscale_max_write_capacity = 20
    enable_autoscaler            = true

    dynamodb_attributes = [
      {
        name = "DailyAverage"
        type = "N"
      },
      {
        name = "HighWater"
        type = "N"
      },
      {
        name = "Timestamp"
        type = "S"
      }
    ]

    local_secondary_index_map = [
      {
        name               = "TimestampSortIndex"
        range_key          = "Timestamp"
        projection_type    = "INCLUDE"
        non_key_attributes = ["HashKey", "RangeKey"]
      },
      {
        name               = "HighWaterIndex"
        range_key          = "Timestamp"
        projection_type    = "INCLUDE"
        non_key_attributes = ["HashKey", "RangeKey"]
      }
    ]

    global_secondary_index_map = [
      {
        name               = "DailyAverageIndex"
        hash_key           = "DailyAverage"
        range_key          = "HighWater"
        write_capacity     = 5
        read_capacity      = 5
        projection_type    = "INCLUDE"
        non_key_attributes = ["HashKey", "RangeKey"]
      }
    ]

    replicas = ["us-east-1"]
  }
  ```

  __NOTE:__ Variables "global_secondary_index_map" and "local_secondary_index_map" have a predefined schema, but in some cases not all fields are required or needed.

  For example:
   * `non_key_attributes` can't be specified for Global Secondary Indexes (GSIs) when `projection_type` is `ALL`
   * `read_capacity` and `write_capacity` are not required for GSIs

  In these cases, set the fields to `null` and Terraform will treat them as if they were not provided at all, but will not complain about missing values:

  ```hcl
    global_secondary_index_map = [
      {
        write_capacity     = null
        read_capacity      = null
        projection_type    = "ALL"
        non_key_attributes = null
      }
    ]
  ```

  See [Terraform types and values](https://www.terraform.io/docs/configuration/expressions.html#types-and-values) for more details.

  ## Experimental: Standalone Global Secondary Index Resource

  This module now supports the experimental `aws_dynamodb_global_secondary_index` resource introduced in AWS Provider 6.28.0.
  This resource allows you to manage Global Secondary Indexes independently from the main table resource.

  **⚠️ IMPORTANT:**
  - This is an **EXPERIMENTAL** feature that requires setting the environment variable `TF_AWS_EXPERIMENT_dynamodb_global_secondary_index=1` **before running any Terraform commands** (init, plan, apply, validate, etc.)
  - Do NOT toggle `global_secondary_index_resource_enabled` on an existing table, as this will cause Terraform to recreate the indexes
  - This feature is not covered by any SLA or support agreement and may not be suitable for production workloads
  - The experimental resource may change or be removed in future AWS provider versions

  To use the standalone resource:

  1. Set the environment variable: `export TF_AWS_EXPERIMENT_dynamodb_global_secondary_index=1`
  2. Set `global_secondary_index_resource_enabled = true` in your module configuration

  The module will use the same `global_secondary_index_map` variable but create standalone resources instead of inline blocks:

  ```hcl
  module "dynamodb_table" {
    source = "cloudposse/dynamodb/aws"
    # Cloud Posse recommends pinning every module to a specific version
    # version     = "x.x.x"
    namespace                    = "eg"
    stage                        = "dev"
    name                         = "cluster"
    hash_key                     = "HashKey"
    range_key                    = "RangeKey"
    enable_autoscaler            = true

    # Enable the experimental standalone GSI resource
    global_secondary_index_resource_enabled = true

    dynamodb_attributes = [
      {
        name = "DailyAverage"
        type = "N"
      },
      {
        name = "HighWater"
        type = "N"
      }
    ]

    # Use the same global_secondary_index_map variable as before
    global_secondary_index_map = [
      {
        name               = "DailyAverageIndex"
        hash_key           = "DailyAverage"
        range_key          = "HighWater"
        write_capacity     = 5
        read_capacity      = 5
        projection_type    = "INCLUDE"
        non_key_attributes = ["HashKey", "RangeKey"]
      }
    ]
  }
  ```
